name: AIRI Oracle

on:
  push:
    branches: [ main, ai-fixes ]
  pull_request:
    branches: [ main ]

jobs:
  oracle:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Oracle Requirements
        run: |
          python -m pip install --disable-pip-version-check networkx rich

      - name: Run AIRI Oracle
        run: |
          python .github/workflows/oracly.py

      - name: Upload Oracle Report
        uses: actions/upload-artifact@v4
        with:
          name: oracle-report
          path: oracle_report.json
