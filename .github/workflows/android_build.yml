name: AIRI Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RELEASE_SIGNING_READY: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AIRI_VERSION_CODE: ${{ github.run_number }}
      AIRI_VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle cache
      uses: gradle/actions/setup-gradle@v4

    - name: Setup Android SDK + NDK + CMake
      uses: android-actions/setup-android@v3
      with:
        # The legacy `tools` SDK package was removed from current repositories.
        # Install only the maintained platform-tools here; the build-specific
        # platform, build-tools, NDK, and CMake are installed below.
        packages: "platform-tools"
        accept-android-sdk-licenses: true

    - name: Install NDK & CMake
      run: |
        sdkmanager --install "ndk;25.2.9519653"
        sdkmanager --install "cmake;3.22.1"
        sdkmanager --install "platforms;android-36"
        sdkmanager --install "build-tools;36.0.0"

    - name: Grant execute permission
      run: chmod +x gradlew .github/scripts/run-instrumentation.sh .github/scripts/set-emulator-locale.sh

    - name: Verify source contracts and localization
      run: |
        python3 tools/airi_runtime_simulation.py
        python3 tools/final_runtime_integration_audit.py
        python3 tools/stability/local_model_performance_sim.py
        python3 scripts/connector_lifecycle_static_scan.py
        python3 scripts/runtime_state_simulation.py
        python3 scripts/telemetry_privacy_scan.py
        python3 scripts/verify_google_oauth_config.py --config app/google-services.json
        python3 -m unittest discover -s scripts -p 'test_google_oauth_config.py' -v
        if [ -n "${OPENAI_API_KEY:-}" ] || [ -n "${GEMINI_API_KEY:-}" ]; then
          python3 tools/stability/cloud_api_smoke.py --allow-missing
        else
          echo '{"status":"SKIP","detail":"OPENAI_API_KEY and GEMINI_API_KEY are not configured"}'
        fi
        python3 tools/verify_core_changes.py
        python3 scripts/airi_localization_health.py --strict
        python3 scripts/airi_release_health.py
        git diff --check

    - name: Build and test shared core
      run: ./gradlew :core-domain:desktopTest :core-domain:compileDebugKotlinAndroid --stacktrace

    - name: Clean, compile, and package debug build
      run: |
        ./gradlew clean :app:assembleDebug \
          -Pandroid.native.buildOutput=verbose \
          --stacktrace

    - name: Run unit tests and Android lint
      run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace

    - name: Compile release sources
      run: ./gradlew :app:compileReleaseKotlin --stacktrace

    - name: Package unsigned release APK
      if: github.ref != 'refs/heads/main' || env.RELEASE_SIGNING_READY != 'true'
      run: |
        ./gradlew --no-daemon --max-workers=1 \
          '-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC' \
          :app:assembleRelease :app:bundleRelease --stacktrace

    - name: Package signed release outputs
      if: github.ref == 'refs/heads/main' && env.RELEASE_SIGNING_READY == 'true'
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        ./gradlew --no-daemon --max-workers=1 \
          '-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC' \
          :app:assembleRelease :app:bundleRelease --stacktrace

    - name: Report unavailable release signing
      if: github.ref == 'refs/heads/main' && env.RELEASE_SIGNING_READY != 'true'
      run: |
        echo 'Release packaging was skipped because the required signing secrets are not configured.'
        echo 'Set KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD before publishing.'

    - name: Remove temporary signing material
      if: always()
      run: rm -f release.keystore

    - name: Prepare Android instrumentation APKs
      run: |
        ./gradlew --no-daemon --max-workers=1 \
          '-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC' \
          '-Dkotlin.daemon.jvmargs=-Xmx1536m' \
          :app:assembleDebugAndroidTest --stacktrace

    - name: Run Android instrumentation tests
      uses: reactivecircus/android-emulator-runner@v2
      timeout-minutes: 35
      env:
        EXPECTED_LOCALE: en-US
      with:
        api-level: 29
        target: default
        arch: x86_64
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048
        script: |
          bash .github/scripts/set-emulator-locale.sh "$EXPECTED_LOCALE"
          bash .github/scripts/run-instrumentation.sh

    - name: Collect instrumentation and accessibility evidence
      if: always()
      run: |
        mkdir -p ci-instrumentation
        cp -R app/build/outputs/androidTest-results ci-instrumentation/androidTest-results 2>/dev/null || true
        cp -R app/build/reports/androidTests ci-instrumentation/androidTests 2>/dev/null || true
        timeout 10s adb logcat -d -t 500 > ci-instrumentation/logcat.txt 2>/dev/null || true
        timeout 10s adb shell uiautomator dump /sdcard/airi-ui.xml >/dev/null 2>&1 || true
        timeout 10s adb pull /sdcard/airi-ui.xml ci-instrumentation/ui.xml >/dev/null 2>&1 || true

    - name: Upload instrumentation evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: AIRI-Android-Instrumentation-Evidence
        path: ci-instrumentation/
        if-no-files-found: warn

    - name: Verify native library output
      run: |
        if ! find app/build -name "libairi_native.so" | grep -q .; then
          echo "Native library was not produced."
          exit 1
        fi

    - name: Prepare Android release evidence
      if: success()
      run: |
        set -euo pipefail
        mkdir -p ci-artifacts
        cp app/build/outputs/apk/debug/*.apk ci-artifacts/debug.apk
        cp app/build/outputs/apk/release/*.apk ci-artifacts/release.apk
        cp app/build/outputs/bundle/release/*.aab ci-artifacts/release.aab
        cp app/build/outputs/mapping/release/mapping.txt ci-artifacts/mapping.txt
        test -s ci-artifacts/debug.apk
        test -s ci-artifacts/release.apk
        test -s ci-artifacts/release.aab
        test -s ci-artifacts/mapping.txt
        sha256sum ci-artifacts/* > ci-artifacts/SHA256SUMS
        if [ "${RELEASE_SIGNING_READY}" = "true" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
          APKSIGNER="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose ci-artifacts/release.apk
          APK_SHA1="$("$APKSIGNER" verify --print-certs ci-artifacts/release.apk | sed -n 's/^Signer #1 certificate SHA-1 digest: //p' | head -n 1)"
          test -n "$APK_SHA1"
          python3 scripts/verify_google_oauth_config.py --config app/google-services.json --expected-sha1 "$APK_SHA1"
          "$APKSIGNER" verify --verbose ci-artifacts/debug.apk || true
        else
          cp ci-artifacts/SHA256SUMS ci-artifacts/UNSIGNED_SHA256SUMS
        fi

    - name: Upload Android release evidence
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: AIRI-Android-Release-Evidence
        path: ci-artifacts/
        if-no-files-found: error

  instrumentation_matrix:
    name: Instrumentation API ${{ matrix.api-level }} / ${{ matrix.locale }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        # API 35's hosted system image does not reach sys.boot_completed on
        # the current GitHub runner. Keep a stable legacy baseline and the
        # latest stable image that boots reliably in this matrix.
        # Arabic and API 34 runs exercise a heavier RTL/GMS path and have
        # repeatedly shown Binder/package-manager pressure at the 2 GiB
        # default guest budget. Keep the English API 29 baseline unchanged,
        # and size only the affected matrix entries explicitly.
        include:
          - api-level: 29
            locale: en-US
            memory: 2048
            cores: 2
            target: google_apis
          - api-level: 29
            locale: ar-SA
            memory: 4096
            cores: 4
            target: google_apis
          - api-level: 34
            locale: en-US
            memory: 4096
            cores: 4
            target: default
          - api-level: 34
            locale: ar-SA
            memory: 4096
            cores: 4
            target: default
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle cache
      uses: gradle/actions/setup-gradle@v4
    - name: Setup Android SDK + NDK + CMake
      uses: android-actions/setup-android@v3
      with:
        packages: "platform-tools"
        accept-android-sdk-licenses: true
    - name: Install matrix Android platform and native toolchain
      run: |
        sdkmanager --install "platforms;android-${{ matrix.api-level }}"
        sdkmanager --install "platforms;android-36"
        sdkmanager --install "build-tools;36.0.0"
        sdkmanager --install "ndk;25.2.9519653"
        sdkmanager --install "cmake;3.22.1"
    - name: Grant execute permission
      run: chmod +x gradlew .github/scripts/run-instrumentation.sh .github/scripts/set-emulator-locale.sh
    - name: Prepare instrumentation APKs
      run: |
        ./gradlew --no-daemon --max-workers=1 \
          '-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC' \
          '-Dkotlin.daemon.jvmargs=-Xmx1536m' \
          :app:assembleDebugAndroidTest --stacktrace
    - name: Run locale instrumentation
      uses: reactivecircus/android-emulator-runner@v2
      timeout-minutes: 35
      env:
        EXPECTED_API_LEVEL: ${{ matrix.api-level }}
        EXPECTED_LOCALE: ${{ matrix.locale }}
      with:
        api-level: ${{ matrix.api-level }}
        target: ${{ matrix.target }}
        arch: x86_64
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory ${{ matrix.memory }} -cores ${{ matrix.cores }}
        script: |
          bash .github/scripts/set-emulator-locale.sh "$EXPECTED_LOCALE"
          bash .github/scripts/run-instrumentation.sh

    - name: Collect matrix evidence
      if: always()
      run: |
        mkdir -p ci-instrumentation-${{ matrix.api-level }}-${{ matrix.locale }}
        cp -R app/build/outputs/androidTest-results ci-instrumentation-${{ matrix.api-level }}-${{ matrix.locale }}/androidTest-results 2>/dev/null || true
        cp -R app/build/reports/androidTests ci-instrumentation-${{ matrix.api-level }}-${{ matrix.locale }}/androidTests 2>/dev/null || true
        timeout 10s adb logcat -d -t 500 > ci-instrumentation-${{ matrix.api-level }}-${{ matrix.locale }}/logcat.txt 2>/dev/null || true
        timeout 10s adb shell uiautomator dump /sdcard/airi-ui.xml >/dev/null 2>&1 || true
        timeout 10s adb pull /sdcard/airi-ui.xml ci-instrumentation-${{ matrix.api-level }}-${{ matrix.locale }}/ui.xml >/dev/null 2>&1 || true
    - name: Upload matrix evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: AIRI-Instrumentation-API${{ matrix.api-level }}-${{ matrix.locale }}
        path: ci-instrumentation-${{ matrix.api-level }}-${{ matrix.locale }}/
        if-no-files-found: warn
