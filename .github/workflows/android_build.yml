name: AIRI Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # إعداد Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 🔥 تثبيت NDK + CMake (الحل الحقيقي)
    - name: Install Android NDK and CMake
      run: |
        yes | sdkmanager --licenses
        sdkmanager "platforms;android-34"
        sdkmanager "build-tools;34.0.0"
        sdkmanager "ndk;25.2.9519653"
        sdkmanager "cmake;3.22.1"

    # تأكيد المسارات (مهم لبعض البيئات)
    - name: Set Android environment variables
      run: |
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 🔍 للتأكد أن Gradle يرى الـ NDK
    - name: Verify NDK installation
      run: |
        ls $ANDROID_SDK_ROOT/ndk
        ls $ANDROID_SDK_ROOT/cmake

    # 🔥 البناء الحقيقي (يجب أن يشغل CMake)
    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace --info

    # رفع الـ APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AIRI-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
