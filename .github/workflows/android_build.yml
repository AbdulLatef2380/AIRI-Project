name: AIRI Android CI

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle cache
      uses: gradle/actions/setup-gradle@v4

    - name: Setup Android SDK + NDK + CMake
      uses: android-actions/setup-android@v3

    - name: Install NDK & CMake
      run: |
        sdkmanager --install "ndk;25.2.9519653"
        sdkmanager --install "cmake;3.22.1"
        sdkmanager --install "platforms;android-34"
        sdkmanager --install "build-tools;34.0.0"

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Clean, compile, and package debug build
      run: |
        ./gradlew clean :app:assembleDebug \
          -Pandroid.native.buildOutput=verbose \
          --stacktrace

    - name: Run unit tests and Android lint
      run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace

    - name: Compile and package release outputs
      run: |
        ./gradlew :app:compileReleaseKotlin :app:assembleRelease :app:bundleRelease --stacktrace

    - name: Run Android instrumentation tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        target: default
        arch: x86_64
        script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

    - name: Verify native library output
      run: |
        if ! find app/build -name "libairi_native.so" | grep -q .; then
          echo "Native library was not produced."
          exit 1
        fi

    - name: Upload build outputs and reports
      uses: actions/upload-artifact@v4
      with:
        name: AIRI-Android-Build-Evidence
        path: |
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/release/*.apk
          app/build/outputs/bundle/release/*.aab
          app/build/reports/
          app/build/test-results/
          app/build/outputs/androidTest-results/
        if-no-files-found: warn
