name: Android CI

on:
  push:
    branches:
      - architecture-refactor
  pull_request:
    branches:
      - architecture-refactor
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Build project
        run: ./gradlew build
