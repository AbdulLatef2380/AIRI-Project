name: AIRI Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RELEASE_SIGNING_READY: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle cache
      uses: gradle/actions/setup-gradle@v4

    - name: Setup Android SDK + NDK + CMake
      uses: android-actions/setup-android@v3

    - name: Install NDK & CMake
      run: |
        sdkmanager --install "ndk;25.2.9519653"
        sdkmanager --install "cmake;3.22.1"
        sdkmanager --install "platforms;android-36"
        sdkmanager --install "build-tools;36.0.0"

    - name: Grant execute permission
      run: chmod +x gradlew .github/scripts/run-instrumentation.sh

    - name: Verify source contracts and localization
      run: |
        python3 tools/verify_core_changes.py
        python3 scripts/airi_localization_health.py --strict
        git diff --check

    - name: Build and test shared core
      run: ./gradlew :core-domain:desktopTest :core-domain:compileDebugKotlinAndroid --stacktrace

    - name: Clean, compile, and package debug build
      run: |
        ./gradlew clean :app:assembleDebug \
          -Pandroid.native.buildOutput=verbose \
          --stacktrace

    - name: Run unit tests and Android lint
      run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace

    - name: Compile release sources
      run: ./gradlew :app:compileReleaseKotlin --stacktrace

    - name: Package unsigned release verification
      if: github.ref != 'refs/heads/main'
      run: |
        ./gradlew --no-daemon --max-workers=1 \
          '-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC' \
          :app:assembleRelease :app:bundleRelease --stacktrace

    - name: Verify unsigned release outputs and record evidence
      if: github.ref != 'refs/heads/main'
      run: |
        test -f app/build/outputs/mapping/release/mapping.txt
        mkdir -p app/build/release-evidence
        aapt_bin="$(find "${ANDROID_HOME:?}/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
        test -x "$aapt_bin"
        for apk in app/build/outputs/apk/release/*.apk; do
          "$aapt_bin" dump badging "$apk" > "app/build/release-evidence/$(basename "$apk").badging.txt"
        done
        for bundle in app/build/outputs/bundle/release/*.aab; do
          unzip -t "$bundle" > "app/build/release-evidence/$(basename "$bundle").ziptest.txt"
        done
        sha256sum \
          app/build/outputs/apk/release/*.apk \
          app/build/outputs/bundle/release/*.aab \
          app/build/outputs/mapping/release/mapping.txt \
          > app/build/release-evidence/UNSIGNED_SHA256SUMS

    - name: Package signed release outputs
      if: github.ref == 'refs/heads/main' && env.RELEASE_SIGNING_READY == 'true'
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        ./gradlew --no-daemon --max-workers=1 \
          '-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC' \
          :app:assembleRelease :app:bundleRelease --stacktrace

    - name: Verify signed release outputs and record evidence
      if: github.ref == 'refs/heads/main' && env.RELEASE_SIGNING_READY == 'true'
      run: |
        test -f app/build/outputs/mapping/release/mapping.txt
        mkdir -p app/build/release-evidence
        apksigner_bin="$(find "${ANDROID_HOME:?}/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
        test -x "$apksigner_bin"
        for apk in app/build/outputs/apk/release/*.apk; do
          "$apksigner_bin" verify --verbose "$apk"
          "$apksigner_bin" verify --print-certs "$apk" > "app/build/release-evidence/$(basename "$apk").apksigner.txt"
        done
        sha256sum \
          app/build/outputs/apk/release/*.apk \
          app/build/outputs/bundle/release/*.aab \
          app/build/outputs/mapping/release/mapping.txt \
          > app/build/release-evidence/SHA256SUMS

    - name: Report unavailable release signing
      if: github.ref == 'refs/heads/main' && env.RELEASE_SIGNING_READY != 'true'
      run: |
        echo 'Release packaging was skipped because the required signing secrets are not configured.'
        echo 'Set KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD before publishing.'

    - name: Remove temporary signing material
      if: always()
      run: rm -f release.keystore

    - name: Prepare Android instrumentation APKs
      run: |
        ./gradlew --no-daemon --max-workers=1 \
          '-Dorg.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC' \
          :app:assembleDebugAndroidTest --stacktrace

    - name: Run Android instrumentation tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        target: default
        arch: x86_64
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048
        script: bash .github/scripts/run-instrumentation.sh

    - name: Verify native library output
      run: |
        if ! find app/build -name "libairi_native.so" | grep -q .; then
          echo "Native library was not produced."
          exit 1
        fi

    - name: Upload Android test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: AIRI-Android-Test-Reports
        path: |
          app/build/reports/androidTests/
          app/build/outputs/androidTest-results/
        if-no-files-found: warn

    - name: Upload build outputs and reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: AIRI-Android-Build-Evidence
        path: |
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/release/*.apk
          app/build/outputs/bundle/release/*.aab
          app/build/outputs/mapping/release/
          app/build/release-evidence/
          app/build/reports/
          app/build/test-results/
          app/build/outputs/androidTest-results/
        if-no-files-found: warn
