name: AIRI Android CI

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK + NDK + CMake
      uses: android-actions/setup-android@v3

    - name: Install NDK & CMake
      run: |
        sdkmanager --install "ndk;25.2.9519653"
        sdkmanager --install "cmake;3.22.1"
        sdkmanager --install "platforms;android-34"
        sdkmanager --install "build-tools;34.0.0"

    - name: Grant execute permission
      run: chmod +x gradlew

    # 🔥 تنظيف كامل (مهم جداً)
    - name: Clean project
      run: ./gradlew clean

    # 🔥 بناء مع إجبار native
    - name: Build APK (with native)
      run: |
        ./gradlew assembleDebug \
        -Pandroid.native.buildOutput=verbose \
        --stacktrace

    # 🔥 تحقق من وجود .so (أهم خطوة)
    - name: Verify native library
      run: |
        echo "Checking for libairi_native.so..."
        find . -name "libairi_native.so"

        if ! find . -name "libairi_native.so" | grep -q .; then
          echo "❌ ERROR: Native library NOT built!"
          exit 1
        else
          echo "✅ Native library found"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AIRI-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
