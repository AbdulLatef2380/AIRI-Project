name: AIRI Native JNI Smoke

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: HTTPS URL for a redistributable GGUF test model (not committed)
        required: true
        type: string
      model_sha256:
        description: Expected lowercase SHA-256 of the GGUF file
        required: true
        type: string
      api_level:
        description: Android API level for the emulator
        required: false
        default: '34'
        type: string
      locale:
        description: Emulator locale
        required: false
        default: en-US
        type: string

permissions:
  contents: read

jobs:
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NATIVE_SMOKE_URL: ${{ inputs.model_url }}
      NATIVE_SMOKE_SHA256: ${{ inputs.model_sha256 }}
      NATIVE_SMOKE_EVIDENCE_DIR: ci-native-smoke
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install build toolchains
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;25.2.9519653" "cmake;3.22.1"
      - name: Verify provenance manifest
        run: |
          python3 tools/native_snapshot_manifest.py
          git diff --exit-code -- docs/native/NATIVE_SNAPSHOT_MANIFEST.json
      - name: Download and verify external test model
        run: |
          mkdir -p ci-native-smoke
          curl --fail --location --retry 3 --output ci-native-smoke/model.gguf "$NATIVE_SMOKE_URL"
          export NATIVE_SMOKE_MODEL="$GITHUB_WORKSPACE/ci-native-smoke/model.gguf"
          sha256sum "$NATIVE_SMOKE_MODEL" | tee ci-native-smoke/model.sha256
          test "$(sha256sum "$NATIVE_SMOKE_MODEL" | awk '{print $1}')" = "$NATIVE_SMOKE_SHA256"
          echo "NATIVE_SMOKE_MODEL=$NATIVE_SMOKE_MODEL" >> "$GITHUB_ENV"
      - name: Build debug x86_64 APKs
        run: |
          chmod +x gradlew .github/scripts/run-native-smoke.sh .github/scripts/set-emulator-locale.sh
          ./gradlew --no-daemon --max-workers=1 :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Run JNI lifecycle smoke
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 60
        env:
          EXPECTED_LOCALE: ${{ inputs.locale }}
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 4096
          script: |
            bash .github/scripts/set-emulator-locale.sh "$EXPECTED_LOCALE"
            bash .github/scripts/run-native-smoke.sh
      - name: Upload native smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AIRI-native-smoke-api-${{ inputs.api_level }}-${{ inputs.locale }}
          path: ci-native-smoke/
          if-no-files-found: warn
          retention-days: 7
